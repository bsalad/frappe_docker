# Finance yard: keep ERPNext on loopback only (reach it through tailscale serve, not the LAN),
# and run the custom image with erpnextswiss and bi_finance (finance/docs/swiss.md) instead of the stock one.
# The Swiss QR code is drawn by bi_finance on the server, from inside the image: no mounts here.
services:
  frontend:
    image: frappe-finance-custom:v16.50.0-swiss-bi9
    ports: !override
      - "127.0.0.1:8080:8080"
  backend:
    image: frappe-finance-custom:v16.50.0-swiss-bi9
  configurator:
    image: frappe-finance-custom:v16.50.0-swiss-bi9
  create-site:
    image: frappe-finance-custom:v16.50.0-swiss-bi9
  queue-long:
    image: frappe-finance-custom:v16.50.0-swiss-bi9
  queue-short:
    image: frappe-finance-custom:v16.50.0-swiss-bi9
  scheduler:
    image: frappe-finance-custom:v16.50.0-swiss-bi9
  websocket:
    image: frappe-finance-custom:v16.50.0-swiss-bi9
