# Finance yard: keep ERPNext on loopback only (reach it through tailscale serve, not the LAN),
# and run the custom image with erpnextswiss (finance/docs/swiss.md) instead of the stock one.
# The Swiss QR code is drawn on the server (finance/qrbill/qrbill.py): that folder is mounted
# read only and put on the Python path of the services that render prints.
services:
  frontend:
    image: frappe-finance-custom:v16.50.0-swiss
    ports: !override
      - "127.0.0.1:8080:8080"
  backend:
    image: frappe-finance-custom:v16.50.0-swiss
    environment:
      PYTHONPATH: /home/frappe/finance-qrbill
    volumes:
      - ./finance/qrbill:/home/frappe/finance-qrbill:ro
  configurator:
    image: frappe-finance-custom:v16.50.0-swiss
  create-site:
    image: frappe-finance-custom:v16.50.0-swiss
  queue-long:
    image: frappe-finance-custom:v16.50.0-swiss
    environment:
      PYTHONPATH: /home/frappe/finance-qrbill
    volumes:
      - ./finance/qrbill:/home/frappe/finance-qrbill:ro
  queue-short:
    image: frappe-finance-custom:v16.50.0-swiss
    environment:
      PYTHONPATH: /home/frappe/finance-qrbill
    volumes:
      - ./finance/qrbill:/home/frappe/finance-qrbill:ro
  scheduler:
    image: frappe-finance-custom:v16.50.0-swiss
  websocket:
    image: frappe-finance-custom:v16.50.0-swiss
